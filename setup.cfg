[flake8]
# Strict formatting parameters for enterprise multi-tenant pipelines
max-line-length = 120
exclude = 
    .git,
    .venv,
    __pycache__,
    migrations/versions/*,
    data/*
# Ignore specific stylistic spacing items that clash with modern code formatters
ignore = E203, W503, E501

[tool:pytest]
# Configures automated test tracking suites to run asynchronously and safely in memory
asyncio_mode = auto
testpaths = tests
python_files = *.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers

[coverage:run]
# Tracks internal volatile code paths execution coverage during tests
branch = True
source = core, server, worker
omit = 
    tests/*,
    migrations/*,
    database_setup.py

[coverage:report]
# Enforces strict visibility rules across structural test passes
show_missing = True
fail_under = 80
