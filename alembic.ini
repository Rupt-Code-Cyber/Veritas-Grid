# ====================================================================
# SECURE INTAKE GATEWAY - SCHEMA MIGRATION CORE ROUTING ENGINE
# Configuration profile for tracking SQL ledger updates natively.
# ====================================================================

[alembic]
# 1. Map physical path properties to your migration history directory folder
script_location = migrations

# Append parent directory paths natively to locate systemic imports smoothly
prepend_sys_path = .

# 2. Database Connection Fallback Target
# Note: This is overridden dynamically at runtime by migrations/env.py to match your config/.env values
sqlalchemy.url = sqlite:///data/civic_gateway.db

# 3. Migration Naming Standards Output Layout
file_template = %%(year)d_%%(month)02d_%%(day)02d_%%(hour)02d%%(minute)02d-%%(rev)s_%%(slug)s

[post_write_hooks]
# Automated hooks can format migration files instantly post-generation
# hooks = black

# ====================================================================
# LOGGING ENGINE SUB-SYSTEM CONFIGURATIONS
# ====================================================================
[loggers]
keys = root,alembic,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
